<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction and Table</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="nav-link">Cashier</a>
        <a href="transaction.html" class="nav-link active">Transaction and Table</a>
      </div>
      <div class="nav-right">
        <span class="user">Vicky</span>
      </div>
  </header>

  <main class="transaction-container">
    <section class="transaction-left">
      <div class="filter-bar">
        <input type="text" id="search" placeholder="Search here...">
        <input type="date" id="filterDate" />
      </div>

      <table class="transaction-table" id="transaction-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Qty Ordered</th>
            <th>Total Amount</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="transactionBody"></tbody>
      </table>
    </section>

    <aside class="table-list">
      <h3>Table</h3>
      <div id="tables"></div>
    </aside>
  </main>

  <script src="js/script.js"></script>
</body>
</html>

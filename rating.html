<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratings - Customer Feedback</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>

    <header class="header">
        Ratings - Customer Feedback
    </header>

    <main class="container">
        <h2>Penilaian Pelanggan</h2>

        <div class="card">
            <p class="question">Bagaimana pengalaman Anda hari ini?</p>

            <div class="stars">
                ★ ★ ★ ★ ★
            </div>

            <label class="label">Tinjauan Anda</label>
            <textarea placeholder="Bagikan pengalaman Anda di sini mengenai kopi, layanan, atau suasana..."></textarea>

            <button class="btn">Kirim Penilaian</button>
        </div>
    </main>

</body>
</html>

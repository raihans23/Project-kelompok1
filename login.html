<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransiStock - Log in</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-left">
      <h1>TransiStock</h1>
      <p>Inventory & Transaction Management</p>
      <footer>Made with ❤️</footer>
    </div>

    <div class="login-right">
      <div class="form-box">
        <h2>Log in</h2>
        <form onsubmit="return handleLogin(event)">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="Masukan Email" required>

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukan Password" required>

          <div class="show-pass">
            <input type="checkbox" id="show-password" onclick="togglePassword()">
            <label for="show-password">Show password</label>
          </div>
          <button type="submit">Log in</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const password = document.getElementById("password");
      password.type = password.type === "password" ? "text" : "password";
    }

    function handleLogin(event) {
      event.preventDefault(); // agar tidak reload
      window.location.href = "index.html"; // arahkan ke halaman lain
      return false;
    }
  </script>
</body>
</html>
